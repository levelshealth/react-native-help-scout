// android/build.gradle

def safeExtGet(prop, fallback) {
	rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

buildscript {
	// The Android Gradle plugin is only required when opening the android folder stand-alone.
	// This avoids unnecessary downloads and potential conflicts when the library is included as a
	// module dependency in an application project.
	if (project == rootProject) {
		repositories {
			google()
			jcenter()
		}
		dependencies {
			classpath 'com.android.tools.build:gradle:8.3.2'
		}
	}
}

apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

def isNewArchitectureEnabled() {
	return true
}

def reactNativeArchitectures() {
	def value = project.getProperties().get("reactNativeArchitectures")
	return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

// Matches values in recent template from React Native 0.59 / 0.60
// https://github.com/facebook/react-native/blob/0.59-stable/template/android/build.gradle#L5-L9
// https://github.com/facebook/react-native/blob/0.60-stable/template/android/build.gradle#L5-L9
def DEFAULT_COMPILE_SDK_VERSION = 34
def DEFAULT_BUILD_TOOLS_VERSION = "34.0.0"
def DEFAULT_MIN_SDK_VERSION = 21
def DEFAULT_TARGET_SDK_VERSION = 34


android {
	namespace 'com.codemotionapps.reactnativehelpscout'
	compileSdkVersion safeExtGet('compileSdkVersion', DEFAULT_COMPILE_SDK_VERSION)
	buildToolsVersion safeExtGet('buildToolsVersion', DEFAULT_BUILD_TOOLS_VERSION)
	defaultConfig {
		minSdkVersion safeExtGet('minSdkVersion', DEFAULT_MIN_SDK_VERSION)
		targetSdkVersion safeExtGet('targetSdkVersion', DEFAULT_TARGET_SDK_VERSION)
		versionCode 1
		versionName "1.0"
	}
	lintOptions {
		abortOnError false
	}
	
	externalNativeBuild {
		cmake {
			path "CMakeLists.txt"
		}
	}
	
	buildFeatures {
		prefab true
	}
	
	sourceSets {
		main {
			java {
				if (isNewArchitectureEnabled()) {
					srcDirs += [
						"build/generated/source/codegen/java"
					]
				}
			}
		}
	}
}

repositories {
	mavenCentral()
	mavenLocal()
	maven {
		// All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
		url "$rootDir/../node_modules/react-native/android"
	}
	maven {
		// Android JSC is installed from npm
		url "$rootDir/../node_modules/jsc-android/dist"
	}
	google()
	jcenter()
}

def _beaconVersion = safeExtGet("helpscoutBeacon", "5.1.2")

dependencies {
	// ref:
	// https://github.com/facebook/react-native/blob/0.61-stable/template/android/app/build.gradle#L192
	// noinspection GradleDynamicVersion
	implementation 'com.facebook.react:react-native:+'  // From node_modules

	// noinspection GradleDynamicVersion
	implementation "com.helpscout:beacon:${_beaconVersion}"
}
